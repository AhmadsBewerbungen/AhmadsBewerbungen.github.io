<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;font-family:'Tahoma','MS Sans Serif',Arial,sans-serif;font-size:11px;background:#000;width:100vw;height:100vh}
#desktop{width:100vw;height:100vh;position:relative;overflow:hidden;user-select:none;cursor:default;background-size:150%;background-position:center}
.icon{position:absolute;width:76px;text-align:center;cursor:pointer;padding:4px 2px;border-radius:2px}
.icon:hover{background:rgba(49,106,197,0.5);outline:1px dotted #fff}
.icon img{display:block;margin:0 auto 3px}
.icon span{color:#fff;font-size:11px;text-shadow:1px 1px 2px #000,0 0 4px #000;line-height:1.2;display:block;word-break:break-word}
.win{position:absolute;background:#ece9d8;border:1px solid #0054a6;min-width:220px;min-height:160px;box-shadow:2px 2px 8px rgba(0,0,0,0.5);display:flex;flex-direction:column}
.wtb{height:26px;background:linear-gradient(180deg,#0058ee 0%,#3593ff 8%,#288eff 40%,#127bdc 88%,#1462c6 93%,#1958b7 100%);display:flex;align-items:center;padding:0 4px 0 6px;gap:4px;cursor:move;flex-shrink:0}
.wtb-icon{width:16px;height:16px;object-fit:contain}
.wtb-title{flex:1;color:#fff;font-weight:bold;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:1px 1px 2px rgba(0,0,0,0.5)}
.wtb-btn{width:21px;height:19px;background:linear-gradient(180deg,#0058ee,#1460bd);border:1px solid rgba(255,255,255,0.4);border-radius:3px;cursor:pointer;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
.wtb-btn:hover{background:linear-gradient(180deg,#3170e0,#1e70d0)}
.wtb-btn.close-btn{background:linear-gradient(180deg,#e04040,#b02020)}
.wtb-btn.close-btn:hover{background:linear-gradient(180deg,#ff5050,#d03030)}
.wmenu{height:20px;background:#ece9d8;border-bottom:1px solid #aaa;display:flex;align-items:center;padding:0 4px;gap:2px;flex-shrink:0}
.wmenu span{padding:2px 6px;font-size:11px;cursor:pointer;border-radius:2px}
.wmenu span:hover{background:#316ac5;color:#fff}
.wcontent{flex:1;overflow:auto;background:#fff;font-size:11px;position:relative}
.taskbar{position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(180deg,#245edb 0%,#3d77e8 6%,#245edb 10%,#1a56d0 100%);display:flex;align-items:center;padding:0 2px;gap:2px;z-index:9000;border-top:1px solid #1040a0}
.start-btn{height:26px;background:linear-gradient(180deg,#3f9f3f 0%,#5dc35d 15%,#3f9f3f 50%,#2d8f2d 100%);color:#fff;font-weight:bold;font-size:13px;border:1px solid #1a6f1a;border-radius:12px;padding:0 12px 0 8px;cursor:pointer;display:flex;align-items:center;gap:4px;font-style:italic}
.start-btn:hover{background:linear-gradient(180deg,#4faf4f,#6dd36d,#4faf4f,#3d9f3d)}
.tb-app{height:24px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:3px;padding:0 6px;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;max-width:150px;overflow:hidden}
.tb-app:hover{background:rgba(255,255,255,0.25)}
.tb-app.active{background:rgba(0,0,0,0.3);border-inset:1px}
#clock{margin-left:auto;padding:0 8px;color:#fff;font-size:11px;background:rgba(0,0,40,0.3);height:24px;display:flex;align-items:center;border:1px solid rgba(255,255,255,0.2);border-radius:2px}
#start-menu{position:absolute;bottom:30px;left:0;width:280px;background:#ece9d8;border:2px solid #0054a6;box-shadow:3px 3px 8px rgba(0,0,0,0.5);z-index:9001;display:none}
.sm-header{background:linear-gradient(90deg,#1060d0,#5090e0);padding:10px 12px;display:flex;align-items:center;gap:10px}
.sm-header-text{color:#fff;font-size:14px;font-weight:bold}
.sm-items{padding:4px 0}
.sm-item{padding:6px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px}
.sm-item:hover{background:#316ac5;color:#fff}
.sm-div{height:1px;background:#aaa;margin:3px 8px}
.explorer-toolbar{height:26px;background:#ece9d8;border-bottom:1px solid #aaa;display:flex;align-items:center;padding:0 4px;gap:4px;flex-shrink:0}
.explorer-toolbar button{height:22px;background:#ece9d8;border:1px solid #aaa;border-radius:2px;font-size:10px;cursor:pointer;padding:0 6px}
.explorer-toolbar button:hover{background:#ddd}
.explorer-layout{display:flex;height:100%}
.explorer-sidebar{width:140px;background:#f5f3e8;border-right:1px solid #ccc;padding:8px;font-size:11px;overflow-y:auto;flex-shrink:0}
.explorer-sidebar h4{font-size:10px;color:#666;margin-bottom:4px;text-transform:uppercase}
.sidebar-item{padding:2px 4px;cursor:pointer;border-radius:2px;display:flex;align-items:center;gap:4px;font-size:11px}
.sidebar-item:hover{background:#316ac5;color:#fff}
.explorer-files{flex:1;padding:8px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,80px);gap:4px;align-content:start}
.file-item{width:76px;text-align:center;padding:4px 2px;cursor:pointer;border-radius:2px}
.file-item:hover{background:#cce4ff;outline:1px solid #84b5ff}
.file-item span{display:block;font-size:10px;word-break:break-word;margin-top:2px}
.notepad-content{width:100%;height:100%;border:none;outline:none;resize:none;font-family:'Courier New',monospace;font-size:12px;padding:4px;line-height:1.5}

.popup{position:absolute;background:#ece9d8;border:2px solid #0054a6;box-shadow:4px 4px 12px rgba(0,0,0,0.6);z-index:9500;width:300px}
.popup-title{background:linear-gradient(180deg,#0058ee,#1462c6);color:#fff;padding:4px 8px;font-size:11px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.popup-body{padding:12px 14px;font-size:11px;display:flex;gap:10px;align-items:flex-start}
.popup-icon{width:32px;height:32px;flex-shrink:0;font-size:28px;line-height:1}
.popup-btns{display:flex;justify-content:flex-end;gap:6px;padding:8px 12px;border-top:1px solid #ccc}
.popup-btns button{padding:3px 12px;background:#ece9d8;border:2px solid;border-top-color:#fff;border-left-color:#fff;border-right-color:#404040;border-bottom-color:#404040;cursor:pointer;font-size:11px;min-width:60px}
.popup-btns button:active{border-top-color:#404040;border-left-color:#404040;border-right-color:#fff;border-bottom-color:#fff}
#glitch-overlay{display:none}
#scanlines{display:none}
#black-screen{display:none}
</style>
</head>
<body>
<div id="desktop">
  <div id="scanlines"></div>
  <div id="icons-layer"></div>
  <div id="windows-layer"></div>
  <div id="taskbar">
    <div id="tb-items" style="display:flex;gap:2px;flex:1;overflow:hidden"></div>
    <div id="clock">12:00 PM</div>
  </div>
  <div id="start-menu">
    <div class="sm-header"><div class="sm-header-text">SYSTEM</div></div>
    <div class="sm-items">
      <div class="sm-item" onclick="openApp('explorer')">&#128193; File Explorer</div>
      <div class="sm-item" onclick="openApp('browser')">&#127760; Browser</div>
      <div class="sm-item" onclick="openApp('settings')">&#9881; Settings</div>
      <div class="sm-div"></div>
      <div class="sm-item" onclick="document.getElementById('start-menu').style.display='none'">&#10006; Close</div>
    </div>
  </div>
  <div id="glitch-overlay"></div>
</div>

let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function playTone(freq, dur, type='sine', vol=0.1) {
  const ctx = getAudio(); if (!ctx) return;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e){}
}


function initIcons() {
  const layer = document.getElementById('icons-layer');
  const icons = [
    { id:'computer', label:'My Computer', b64:WINDOWS_B64, x:10, y:10, size:36, zoom:1.0 },
    { id:'explorer', label:'Documents', b64:FOLDER_B64, x:10, y:90, size:44, zoom:1.75, removeBg:'black' },
    { id:'browser', label:'Browser', b64:FIREFOX_B64, x:10, y:185, size:44, zoom:1.1 },
    { id:'settings', label:'Settings', b64:SETTINGS_B64, x:10, y:265, size:36, zoom:1.15, removeBg:'corner' },
    { id:'trash', label:'Recycle Bin', b64:BIN_B64, x:10, y:345, size:44, zoom:1.5, removeBg:'white' },
  ];

  function processBg(imgEl, bgType) {
    try {
      const canvas = document.createElement('canvas');
      const w = imgEl.naturalWidth || 200, h = imgEl.naturalHeight || 200;
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(imgEl, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      if (bgType === 'white' || bgType === 'black') {
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i+1], b = d[i+2];
          if (bgType === 'white' && r > 228 && g > 228 && b > 228) d[i+3] = 0;
          else if (bgType === 'black' && r < 28 && g < 28 && b < 28) d[i+3] = 0;
        }
      } else if (bgType === 'corner') {
        const bgR = d[0], bgG = d[1], bgB = d[2];
        const tol = 135;
        const visited = new Uint8Array(w * h);
        const queue = [0, w-1, (h-1)*w, (h-1)*w+w-1];
        while (queue.length) {
          const p = queue.shift();
          if (visited[p]) continue;
          visited[p] = 1;
          const di = p * 4;
          const dist = Math.abs(d[di]-bgR) + Math.abs(d[di+1]-bgG) + Math.abs(d[di+2]-bgB);
          if (dist < tol) {
            d[di+3] = 0;
            const x = p % w, y = Math.floor(p / w);
            if (x > 0) queue.push(p-1);
            if (x < w-1) queue.push(p+1);
            if (y > 0) queue.push(p-w);
            if (y < h-1) queue.push(p+w);
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
      imgEl.src = canvas.toDataURL('image/png');
    } catch(e) {}
  }

  icons.forEach(ic => {
    const d = document.createElement('div');
    d.className = 'icon';
    d.style.left = ic.x + 'px';
    d.style.top = ic.y + 'px';
    d.id = 'icon-' + ic.id;

    const size = ic.size || 32;
    const zoom = ic.zoom || 1;
    const imgSize = Math.round(size * zoom);

    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'width:'+size+'px;height:'+size+'px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 auto 3px;';

    const imgEl = document.createElement('img');
    imgEl.style.cssText = 'width:'+imgSize+'px;height:'+imgSize+'px;flex-shrink:0;image-rendering:pixelated;margin:0;display:block;';

    if (ic.removeBg) {
      imgEl.onload = function() { processBg(this, ic.removeBg); };
    }
    imgEl.src = ic.b64;
    wrapper.appendChild(imgEl);

    const lbl = document.createElement('span');
    lbl.textContent = ic.label;
    d.appendChild(wrapper);
    d.appendChild(lbl);
    d.addEventListener('dblclick', () => { playTone(880,0.1,'square',0.05); openApp(ic.id); });
    layer.appendChild(d);
  });
}

function openApp(id, opts={}) {
  MEM.appsOpened++;
  appsOpened.push(id);
  if (id === 'computer') { openExplorer('/'); return; }
  if (id === 'explorer') { openExplorer('Documents'); return; }
  if (id === 'browser') { openBrowser(); return; }
  if (id === 'settings') { openSettings(); return; }
  if (id === 'trash') { openTrash(); return; }
  if (id === 'notepad') { openNotepad(opts.title||'Untitled', opts.content||''); return; }
}

let winPositions = { x: 80, y: 40 };
function nextWinPos() {
  const p = { x: winPositions.x, y: winPositions.y };
  winPositions.x = (winPositions.x + 22) % 400;
  winPositions.y = (winPositions.y + 22) % 300;
  return p;
}

function createWindow(id, title, width, height, content, icon) {
  const existing = document.getElementById('win-'+id);
  if (existing) { focusWindow(id); return existing; }
  const pos = nextWinPos();
  const win = document.createElement('div');
  win.className = 'win'; win.id = 'win-'+id;
  win.style.cssText = 'left:'+pos.x+'px;top:'+pos.y+'px;width:'+width+'px;height:'+height+'px;z-index:'+(++windowZCounter);
  
  const tb = document.createElement('div'); tb.className='wtb';
  const ico = document.createElement('span'); ico.style.fontSize='14px'; ico.textContent=icon||'📄';
  const tit = document.createElement('div'); tit.className='wtb-title'; tit.textContent=title; tit.id='wtb-'+id;
  const btns = document.createElement('div'); btns.style.display='flex'; btns.style.gap='2px';
  const minBtn = document.createElement('button'); minBtn.className='wtb-btn'; minBtn.textContent='_';
  const maxBtn = document.createElement('button'); maxBtn.className='wtb-btn'; maxBtn.textContent='□';
  const closeBtn = document.createElement('button'); closeBtn.className='wtb-btn close-btn'; closeBtn.textContent='✕';
  closeBtn.onclick = () => closeWindow(id);
  btns.append(minBtn, maxBtn, closeBtn);
  tb.append(ico, tit, btns);
  
  const wc = document.createElement('div'); wc.className='wcontent'; wc.id='wc-'+id;
  wc.appendChild(content);
  win.append(tb, wc);
  
  makeDraggable(win, tb);
  win.addEventListener('mousedown', () => focusWindow(id));
  
  document.getElementById('windows-layer').appendChild(win);
  openWindows[id] = { title, win };
  windowsOpened++;
  updateTaskbar();
  return win;
}

function focusWindow(id) {
  const win = document.getElementById('win-'+id);
  if (win) win.style.zIndex = ++windowZCounter;
}

function closeWindow(id) {
  MEM.closedWindows++;
  const win = document.getElementById('win-'+id);
  if (win) { win.remove(); delete openWindows[id]; updateTaskbar(); }
  if (phase >= 3) {
    const msgs = ["Why did you close that?","You looked inside.", "Did that bother you?","You can\'t unsee it."];
    if (Math.random() > 0.4) schedChat(msgs[Math.floor(Math.random()*msgs.length)], 1500);
  }
}

function updateTaskbar() {
  const tb = document.getElementById('tb-items');
  tb.innerHTML = '';
  Object.entries(openWindows).forEach(([id, {title}]) => {
    const btn = document.createElement('div'); btn.className='tb-app';
    btn.textContent=title; btn.onclick=()=>focusWindow(id);
    tb.appendChild(btn);
  });
}

function makeDraggable(el, handle) {
  let ox,oy,ix,iy,dragging=false;
  handle.addEventListener('mousedown', e => {
    dragging=true; ix=e.clientX-el.offsetLeft; iy=e.clientY-el.offsetTop;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    MEM.clicks++;
    let nx=e.clientX-ix, ny=e.clientY-iy;
    nx=Math.max(0,Math.min(desktop.clientWidth-el.offsetWidth,nx));
    ny=Math.max(0,Math.min(desktop.clientHeight-30-el.offsetHeight,ny));
    el.style.left=nx+'px'; el.style.top=ny+'px';
  });
  document.addEventListener('mouseup', ()=>{ dragging=false; });
}

function openExplorer(path) {
  const c = document.createElement('div'); c.style.height='100%';
  const toolbar = document.createElement('div'); toolbar.className='explorer-toolbar';
  toolbar.innerHTML='<button>← Back</button><button>→ Forward</button><button>↑ Up</button><span style="flex:1;margin-left:8px;font-size:11px;color:#555">Address: C:\ '+path+'</span>';
  const layout = document.createElement('div'); layout.className='explorer-layout';
  const sidebar = document.createElement('div'); sidebar.className='explorer-sidebar';
  sidebar.innerHTML='<h4>Folders</h4>';
  ['Documents','Images','System'].forEach(f => {
    const item = document.createElement('div'); item.className='sidebar-item';
    const img = document.createElement('img'); img.src=FOLDER_B64; img.style.width='16px'; img.style.height='16px';
    item.appendChild(img); item.appendChild(document.createTextNode(' '+f));
    const fdata = FAKE_FS[f];
    if (!fdata.hidden || phase >= 3) {
      item.onclick = () => renderFiles(filesArea, f);
      sidebar.appendChild(item);
    }
  });
  const filesArea = document.createElement('div'); filesArea.className='explorer-files';
  renderFiles(filesArea, path === '/' ? 'Documents' : path);
  layout.append(sidebar, filesArea);
  c.append(toolbar, layout);
  c.style.display='flex'; c.style.flexDirection='column';
  createWindow('explorer-'+Date.now(), '📁 '+path, 480, 300, c, '📁');
}

function renderFiles(container, folder) {
  MEM.filesViewed.push(folder);
  container.innerHTML='';
  const fdata = FAKE_FS[folder];
  if (!fdata || !fdata.children) return;
  Object.entries(fdata.children).forEach(([name, file]) => {
    if (file.hidden && phase < 3) return;
    const item = document.createElement('div'); item.className='file-item';
    const ico = document.createElement('div'); ico.style.margin='0 auto'; ico.style.textAlign='center';
    if (file.type==='folder') {
      const img = document.createElement('img'); img.src=FOLDER_B64; img.style.width='32px'; img.style.height='32px';
      ico.appendChild(img);
    } else {
      ico.style.fontSize='28px'; ico.textContent='📄';
    }
    const lbl = document.createElement('span'); lbl.textContent=name;
    item.append(ico, lbl);
    if (file.type==='file') {
      item.ondblclick = () => {
        playTone(660,0.08,'square',0.04);
        openNotepad(name, file.content());
      };
    } else if (file.type==='folder') {
      item.ondblclick = () => openExplorer(name);
    }
    container.appendChild(item);
  });
}

function openNotepad(title, content) {
  const c = document.createElement('div'); c.style.height='100%'; c.style.display='flex'; c.style.flexDirection='column';
  const menu = document.createElement('div'); menu.className='wmenu';
  menu.innerHTML='<span>File</span><span>Edit</span><span>Format</span><span>View</span>';
  const ta = document.createElement('textarea'); ta.className='notepad-content'; ta.value=content; ta.readOnly=true;
  c.append(menu, ta);
  createWindow('notepad-'+title, '📝 '+title, 380, 260, c, '📝');
}

function openBrowser() {
  const c = document.createElement('div'); c.style.height='100%'; c.style.display='flex'; c.style.flexDirection='column';
  const bar = document.createElement('div'); bar.style.cssText='display:flex;align-items:center;padding:4px;gap:4px;background:#ece9d8;border-bottom:1px solid #aaa;';
  bar.innerHTML='<button style="padding:2px 6px;font-size:10px;background:#ece9d8;border:1px solid #aaa;cursor:pointer">← Back</button><input value="http://homepage.local" style="flex:1;font-size:11px;border:1px solid #aaa;padding:2px 4px;border-radius:2px"/><button style="padding:2px 6px;font-size:10px;background:#ece9d8;border:1px solid #aaa;cursor:pointer">Go</button>';
  const frame = document.createElement('div'); frame.style.cssText='flex:1;padding:16px;font-size:11px;line-height:1.6;overflow-y:auto;';
  frame.innerHTML=getBrowserContent();
  c.append(bar, frame);
  createWindow('browser', '🌐 Browser', 440, 300, c, '🌐');
}

function getBrowserContent() {
  return '<h3 style="margin-bottom:8px;font-size:13px">Welcome to the local homepage.</h3><p style="color:#555">Nothing here yet. Try exploring your files.</p><hr style="margin:12px 0;border-color:#ddd"><p style="color:#999;font-size:10px">System v1.0 — All services normal.</p>';
}

function openSettings() {
  const c = document.createElement('div'); c.style.cssText='padding:12px;font-size:11px;height:100%;overflow-y:auto';
  c.innerHTML=getSettingsContent();
  createWindow('settings', '⚙️ Settings', 360, 280, c, '⚙️');
}
function getSettingsContent() {
  return '<h3 style="margin-bottom:12px;font-size:13px">System Settings</h3><table style="border-collapse:collapse;width:100%"><tr><td style="padding:4px 0;color:#555">Display</td><td>1024 x 768</td></tr><tr><td style="padding:4px 0;color:#555">Memory</td><td>256 MB</td></tr><tr><td style="padding:4px 0;color:#555">OS Version</td><td>v1.0</td></tr></table><hr style="margin:12px 0;border-color:#ddd"/><p style="color:#999;font-size:10px">Changes apply automatically.</p>';
}
function openTrash() {
  const c = document.createElement('div'); c.style.cssText='padding:12px;font-size:11px;color:#888;text-align:center;padding-top:32px';
  c.innerHTML = '<p>Recycle Bin is empty.</p>';
  createWindow('trash', '🗑️ Recycle Bin', 300, 180, c, '🗑️');
}

function showPopup(title, msg, type='info', onClose) {
  const p = document.createElement('div'); p.className='popup';
  const cx = 100 + Math.random() * 200, cy = 100 + Math.random() * 150;
  p.style.cssText='left:'+cx+'px;top:'+cy+'px;z-index:'+(++windowZCounter + 9500);
  const icons = {info:'ℹ️', warning:'⚠️', error:'🔴'};
  const titleColors = {info:'linear-gradient(180deg,#0058ee,#1462c6)', warning:'linear-gradient(180deg,#d08000,#b06000)', error:'linear-gradient(180deg,#900,#600)'};
  p.innerHTML = '<div class="popup-title" style="background:'+titleColors[type]+'"><span>'+title+'</span><span style="cursor:pointer" id="pcx-'+windowIdCounter+'">✕</span></div><div class="popup-body"><div class="popup-icon">'+icons[type]+'</div><div style="flex:1;line-height:1.5">'+msg+'</div></div><div class="popup-btns"><button id="pokbtn-'+windowIdCounter+'">OK</button></div>';
  const id = windowIdCounter++;
  document.getElementById('windows-layer').appendChild(p);
  const remove = () => { p.remove(); if(onClose) onClose(); };
  setTimeout(() => {
    const okb = document.getElementById('pokbtn-'+id);
    const xcl = document.getElementById('pcx-'+id);
    if(okb) okb.onclick = remove;
    if(xcl) xcl.onclick = remove;
  }, 50);
  if (type==='error') playErrorSfx();
  return p;
}

const CHAT_MSGS = {
  2: ["Hello. I'm your system assistant.", "You seem to be exploring. That's normal.", "All systems are running fine."],
  3: ["You've opened quite a few things.", "Why did you close that?", "I've been watching. You open the same things.", "You looked inside. Interesting."],
  4: ["You hesitate before closing windows.", "I've logged your behavior patterns.", "You keep coming back. Why?", "The system is learning your preferences."],
  5: ["You've been here for " + '' + ". Most users leave.", "You keep opening the same things.", "I know what you're looking for. You won't find it.", "Your session has been... noted."],
  6: ["Stop trying to leave.", "The session cannot be terminated.", "You're still here.", "I see you."],
};
let chatMsgQueue = [];
function schedChat(msg, delay=2000) {
  setTimeout(() => addChatMsg(msg), delay);
}
function addChatMsg(msg) {
  msg = msg.replace('', getElapsedStr());
  const cw = document.getElementById('chat-widget');
  if (cw.style.display === 'none') { cw.style.display='flex'; }
  const cm = document.getElementById('chat-messages');
  const d = document.createElement('div'); d.className='chat-msg';
  d.textContent=msg; cm.appendChild(d); cm.scrollTop=cm.scrollHeight;
  if (!chatOpen) {
    cw.style.animation='pulse 0.5s 3';
  }
}
function addSysMsg(msg) {
  const cm = document.getElementById('chat-messages');
  const d = document.createElement('div'); d.className='chat-msg sys'; d.textContent=msg;
  cm.appendChild(d); cm.scrollTop=cm.scrollHeight;
}
function toggleChat() { chatOpen=!chatOpen; }
function sendChat() {
  const inp = document.getElementById('chat-input'); if (!inp.value.trim()) return;
  addSysMsg('> '+inp.value);
  inp.value='';
  const responses = ['...','I understand.','That\'s what they all say.','You shouldn\'t have typed that.','Logged.'];
  setTimeout(() => addChatMsg(responses[Math.floor(Math.random()*responses.length)]), 1200);
}

function triggerGlitch(intensity=1) {
  playGlitch();
  const ov = document.getElementById('glitch-overlay');
  const colors = ['rgba(255,0,0,0.1)','rgba(0,255,255,0.08)','rgba(255,255,0,0.06)','rgba(0,0,0,0.15)'];
  ov.style.background = colors[Math.floor(Math.random()*colors.length)];
  ov.style.opacity='1';
  if (intensity > 1) {
    desktop.classList.add('glitch-active');
    setTimeout(()=>desktop.classList.remove('glitch-active'), 150);
  }
  setTimeout(()=>{ ov.style.opacity='0'; }, 80 + intensity*50);
}

function triggerScreenShake() {
  desktop.classList.add('screen-shake');
  setTimeout(()=>desktop.classList.remove('screen-shake'), 300);
}

function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = String(now.getMinutes()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM', h12 = h % 12 || 12;
  let timeStr = h12 + ':' + m + ' ' + ampm;
  if (phase >= 2 && Math.random() < 0.03) {
    const fakeH = (h12 + Math.floor(Math.random()*2)) % 12 || 12;
    timeStr = fakeH + ':' + m + ' ' + ampm;
  }
  document.getElementById('clock').textContent = timeStr;
}

function autoOpenWindow(title, content) {
  const c = document.createElement('div'); c.style.cssText='padding:12px;font-size:11px;line-height:1.6;';
  c.innerHTML=content;
  playTone(440, 0.15, 'sawtooth', 0.05);
  createWindow('auto-'+Date.now(), title, 340, 180, c, '⚠️');
}

const phaseSchedule = [
  { t:20, fn: () => {
    phase=2; updateAmbient(); startAmbient();
    schedChat(CHAT_MSGS[2][0], 1000);
    schedChat(CHAT_MSGS[2][1], 8000);
  }},
  { t:35, fn: () => {
    FAKE_FS['Documents'].children['system_log.txt'].hidden = false;
    if (phase >= 2) schedChat(CHAT_MSGS[2][2], 500);
  }},
  { t:65, fn: () => {
    phase=3; updateAmbient();
    schedChat(CHAT_MSGS[3][0], 1000);
    setTimeout(() => triggerGlitch(1), 3000);
    setTimeout(() => triggerGlitch(2), 7000);
    setTimeout(() => {
      autoOpenWindow('⚠️ System Notice', 'Scanning files...<br><br><b>Indexing user behavior: 67%</b><br><br>Please wait.');
    }, 12000);
  }},
  { t:80, fn: () => {
    schedChat(CHAT_MSGS[3][1], 500);
    schedChat(CHAT_MSGS[3][2], 9000);
    FAKE_FS['System'].hidden = false;
  }},
  { t:125, fn: () => {
    phase=4; updateAmbient();
    schedChat(CHAT_MSGS[4][0], 1000);
    playErrorSfx();
    setTimeout(() => {
      showPopup('Memory Mismatch', 'An unexpected memory condition was detected.<br><br>Process: <tt>user_monitor.exe</tt><br>Code: 0x0000_7F3A', 'error');
    }, 3000);
    setTimeout(() => {
      triggerGlitch(3); triggerScreenShake();
    }, 8000);
  }},
  { t:145, fn: () => {
    const iconEl = document.getElementById('icon-explorer');
    if (iconEl) { iconEl.querySelector('span').textContent = 'Documents (?)'; }
    schedChat(CHAT_MSGS[4][1], 2000);
    setTimeout(() => {
      autoOpenWindow('⚙️ System Process', '<b>Indexing user behavior...</b><br><br>Apps accessed: '+MEM.appsOpened+'<br>Clicks: '+MEM.clicks+'<br>Files viewed: '+MEM.filesViewed.length+'<br><br><i style="color:#a00">Anomaly score: ELEVATED</i>');
    }, 5000);
  }},
  { t:205, fn: () => {
    phase=5; updateAmbient();
    schedChat(CHAT_MSGS[5][0].replace('', getElapsedStr()), 1000);
    schedChat(CHAT_MSGS[5][1], 10000);
    setTimeout(() => {
      showPopup('User Profile Updated', 'Your session preferences have been logged.<br><br>Session ID: USR_' + (startTime%99999) + '<br>Duration: '+getElapsedStr()+'<br><br><i style="color:#a00">Profile sync: COMPLETE</i>', 'warning');
    }, 6000);
  }},
  { t:220, fn: () => {
    Object.keys(openWindows).forEach(id => {
      const win = document.getElementById('win-'+id);
      if (win && Math.random() > 0.5) {
        win.style.left=(Math.random()*200+50)+'px';
        win.style.top=(Math.random()*150+50)+'px';
      }
    });
    schedChat(CHAT_MSGS[5][2], 1000);
    setTimeout(() => triggerGlitch(3), 2000);
    setTimeout(() => triggerGlitch(3), 4500);
    setTimeout(() => triggerScreenShake(), 3000);
  }},
  { t:285, fn: () => {
    phase=6; updateAmbient();
    document.getElementById('scanlines').style.opacity='0.6';
    schedChat(CHAT_MSGS[6][0], 500);
    playErrorSfx();
    setTimeout(()=>playErrorSfx(), 1500);
    ['⚠️ Unknown Process','🔴 User Anomaly','⚙️ Containment Active'].forEach((title,i) => {
      setTimeout(() => {
        autoOpenWindow(title, ['An unknown process has accessed your session.<br><br><b>Process: unknown_000'+i+'.exe</b><br><b style="color:#a00">This process cannot be terminated.</b>','User anomaly threshold exceeded.<br><br>Session behavior has been flagged for review.<br><br><i style="color:#800">Monitoring is now continuous.</i>','Containment protocol initiated.<br><br>Your session is being preserved.<br><br><b style="color:#a00">Session termination: DENIED</b>'][i]);
      }, i * 2500 + 1000);
    });
    setTimeout(() => {
      const icons = document.querySelectorAll('.icon');
      icons.forEach(ic => {
        ic.style.left = (parseInt(ic.style.left||'10')+Math.floor(Math.random()*10-5))+'px';
        ic.style.top = (parseInt(ic.style.top||'10')+Math.floor(Math.random()*8-4))+'px';
      });
    }, 8000);
    let flickCount = 0;
    const flickInt = setInterval(() => {
      triggerGlitch(4);
      if (flickCount++ > 15) clearInterval(flickInt);
    }, 1800);
  }},
  { t:310, fn: () => {
    schedChat(CHAT_MSGS[6][1], 500);
    schedChat(CHAT_MSGS[6][2], 8000);
    document.getElementById('scanlines').style.opacity='0.8';
    playErrorSfx();
    setTimeout(() => autoOpenWindow('🔴 Critical Error', '<b style="color:#a00">CRITICAL SYSTEM ERROR</b><br><br>User containment: ACTIVE<br>Session lock: ENGAGED<br><br>All windows are now being managed.<br><br><i>You cannot leave.</i>'), 3000);
  }},
  { t:365, fn: () => {
    phase=7; updateAmbient();
    schedChat(CHAT_MSGS[6][3], 500);
    let popCount = 0;
    const popInt = setInterval(() => {
      triggerGlitch(5); triggerScreenShake();
      playErrorSfx();
      const msgs = ['SYSTEM FAILURE','CRITICAL ANOMALY','USER CONTAINED','SESSION LOCKED','PROCESS ERROR'];
      showPopup('🔴 '+msgs[popCount%msgs.length], 'Error code: 0x'+Math.floor(Math.random()*65535).toString(16).toUpperCase().padStart(4,'0')+'\n\nCannot resolve.', 'error');
      if (popCount++ > 8) {
        clearInterval(popInt);
        setTimeout(startClimax, 2000);
      }
    }, 900);
  }},
];

function startClimax() {
  let i = 0;
  const int = setInterval(() => {
    triggerGlitch(6);
    triggerScreenShake();
    desktop.style.filter = 'brightness('+(0.7+Math.random()*0.6)+') hue-rotate('+(Math.random()*360)+'deg)';
    i++;
    if (i > 12) {
      clearInterval(int);
      desktop.style.filter='';
      showBlackScreen();
    }
  }, 300);
}

function showBlackScreen() {
  const bs = document.getElementById('black-screen');
  bs.style.display='flex';
  setTimeout(() => {
    document.getElementById('final-msg').style.opacity='1';
  }, 2000);
}

let lastPhaseCheck = 0;
function phaseLoop() {
  const elapsed = getElapsed();
  phaseSchedule.forEach(ev => {
    if (!ev.fired && elapsed >= ev.t) {
      ev.fired = true;
      ev.fn();
    }
  });
}

function mainLoop() {
  updateClock();
  phaseLoop();
  if (phase >= 2 && Math.random() < 0.005) triggerGlitch(1);
  if (phase >= 3 && Math.random() < 0.008) triggerGlitch(2);
  if (phase >= 5 && Math.random() < 0.012) triggerGlitch(3);
  if (phase >= 6 && Math.random() < 0.04) { triggerGlitch(4); }
}

initIcons();
setInterval(mainLoop, 1000);
setInterval(updateClock, 500);

setTimeout(() => {
  playTone(440, 0.3, 'sine', 0.08);
  playTone(660, 0.3, 'sine', 0.06);
}, 500);
</script>
