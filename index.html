<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pet Ayman</title>

  <!-- CACHE BUSTING -->
  <link rel="stylesheet" href="style3.css?v=1" />
</head>
<body>

<!-- BACKGROUND (REQUIRED) -->
<img id="bg-img" src="assets/windows_background.jpg">

<div id="desktop">

  <div id="icons">

    <!-- BIG FILE ICON -->
    <div class="icon big" data-app="explorer">
      <img src="assets/folder.png">
      <span>Files</span>
    </div>

    <!-- NORMAL ICON -->
    <div class="icon" data-app="settings">
      <img src="assets/Screenshot_2026-04-10_210544-removebg-preview.png">
      <span>Settings</span>
    </div>

  </div>

  <div id="windows"></div>

  <div id="taskbar">
    <button id="start-btn">Start</button>
    <div id="clock"></div>
  </div>

  <div id="start-menu" class="hidden">
    <div data-app="explorer">File Explorer</div>
    <div data-app="settings">Settings</div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
