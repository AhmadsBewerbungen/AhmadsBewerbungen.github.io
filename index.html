<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Chess Lobby</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    .panel {
      background: #1f2937;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
      font-size: 16px;
    }

    input {
      background: #374151;
      color: white;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    button:hover {
      background: #2563eb;
    }

    .lobby-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lobby-item {
      background: #374151;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .board {
      width: 100%;
      max-width: 700px;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 5px solid #374151;
      border-radius: 12px;
      overflow: hidden;
      margin: auto;
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(22px, 4vw, 48px);
      user-select: none;
    }

    .light {
      background: #f0d9b5;
      color: black;
    }

    .dark {
      background: #b58863;
      color: black;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-size: 18px;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      opacity: 0.7;
      font-size: 14px;
    }

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }

      .board {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <h1>♟ Chess Lobby</h1>

      <h2>Lobby erstellen</h2>
      <input type="text" id="playerName" placeholder="Dein Name" />
      <button onclick="createLobby()">Lobby erstellen</button>

      <h2>Lobby beitreten</h2>
      <input type="text" id="joinCode" placeholder="Lobby Code" />
      <button onclick="joinLobby()">Beitreten</button>

      <div class="lobby-list" id="lobbyList"></div>

      <div class="footer">
        Funktioniert auf Handy & PC
      </div>
    </div>

    <div class="panel">
      <div class="board" id="board"></div>
      <div class="status" id="status">
        Keine Lobby aktiv
      </div>
    </div>
  </div>

  <script>
    const board = document.getElementById('board');
    const statusText = document.getElementById('status');
    const lobbyList = document.getElementById('lobbyList');

    const pieces = {
      r: '♜',
      n: '♞',
      b: '♝',
      q: '♛',
      k: '♚',
      p: '♟',
      R: '♖',
      N: '♘',
      B: '♗',
      Q: '♕',
      K: '♔',
      P: '♙'
    };

    const startPosition = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let selected = null;

    function renderBoard() {
      board.innerHTML = '';

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const square = document.createElement('div');
          square.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
          square.dataset.row = row;
          square.dataset.col = col;

          const piece = startPosition[row][col];
          square.textContent = pieces[piece] || '';

          square.addEventListener('click', () => movePiece(row, col));

          board.appendChild(square);
        }
      }
    }

    function movePiece(row, col) {
      if (!selected) {
        if (startPosition[row][col] !== '') {
          selected = { row, col };
        }
        return;
      }

      startPosition[row][col] = startPosition[selected.row][selected.col];
      startPosition[selected.row][selected.col] = '';

      selected = null;
      renderBoard();
    }

    function generateCode() {
      return Math.random().toString(36).substring(2, 7).toUpperCase();
    }

    function createLobby() {
      const player = document.getElementById('playerName').value || 'Spieler';
      const code = generateCode();

      const lobbies = JSON.parse(localStorage.getItem('lobbies') || '[]');
      lobbies.push({ code, player });

      localStorage.setItem('lobbies', JSON.stringify(lobbies));

      statusText.innerHTML = `Lobby erstellt: <b>${code}</b>`;

      loadLobbies();
    }

    function joinLobby() {
      const code = document.getElementById('joinCode').value.toUpperCase();

      const lobbies = JSON.parse(localStorage.getItem('lobbies') || '[]');
      const found = lobbies.find(l => l.code === code);

      if (found) {
        statusText.innerHTML = `Du bist Lobby <b>${code}</b> beigetreten`;
      } else {
        alert('Lobby nicht gefunden');
      }
    }

    function quickJoin(code) {
      document.getElementById('joinCode').value = code;
      joinLobby();
    }

    function loadLobbies() {
      const lobbies = JSON.parse(localStorage.getItem('lobbies') || '[]');

      lobbyList.innerHTML = '';

      if (lobbies.length === 0) {
        lobbyList.innerHTML = '<div style="opacity:0.7">Keine Lobbys</div>';
        return;
      }

      lobbies.forEach(lobby => {
        const item = document.createElement('div');
        item.className = 'lobby-item';

        item.innerHTML = `
          <div>
            <div><b>${lobby.code}</b></div>
            <div style="font-size:14px;opacity:0.7">${lobby.player}</div>
          </div>
          <button style="width:auto;padding:10px 14px" onclick="quickJoin('${lobby.code}')">
            Join
          </button>
        `;

        lobbyList.appendChild(item);
      });
    }

    renderBoard();
    loadLobbies();
  </script>
</body>
</html>
