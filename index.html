<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pet Ayman</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>

<div id="desktop">

  <!-- BACKGROUND -->
  <div id="background"></div>

  <!-- ICONS -->
  <div id="icons">
    <div class="icon" data-app="explorer">
      <img src="assets/folder.png">
      <span>Files</span>
    </div>

    <div class="icon" data-app="settings">
      <img src="assets/Screenshot_2026-04-10_210544-removebg-preview.png">
      <span>Settings</span>
    </div>
  </div>

  <!-- WINDOWS -->
  <div id="windows"></div>

  <!-- TASKBAR -->
  <div id="taskbar">
    <button id="start-btn">Start</button>
    <div id="clock"></div>
  </div>

  <!-- START MENU -->
  <div id="start-menu" class="hidden">
    <div data-app="explorer">File Explorer</div>
    <div data-app="settings">Settings</div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
