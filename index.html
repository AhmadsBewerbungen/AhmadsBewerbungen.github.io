<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Frage</title>
    <style>
        body {
            background-color: white;
            color: black;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 100px;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Magst du Ahmad?</h1>

    <button id="jaBtn">Ja</button>
    <button id="neinBtn">Nein</button>

    <p id="antwort"></p>

    <script>
        const jaBtn = document.getElementById("jaBtn");
        const neinBtn = document.getElementById("neinBtn");
        const antwort = document.getElementById("antwort");

        let jaSize = 20;

        neinBtn.addEventListener("click", () => {
            jaSize += 10;
            jaBtn.style.fontSize = jaSize + "px";
        });

        jaBtn.addEventListener("click", () => {
            antwort.textContent = "Ich mag dich auch ❤️";
        });
    </script>

</body>
</html>
