
<style>
  @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .page {
    background: #fff;
    min-height: 600px;
    position: relative;
    padding: 48px 40px 60px;
  }
  .paper-lines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: repeating-linear-gradient(transparent, transparent 27px, #e0e8f5 28px);
    pointer-events: none;
    opacity: 0.45;
  }
  .content { position: relative; z-index: 2; padding-left: 24px; }
  .logo { height: 80px; display: block; margin-bottom: 40px; }

  .banners-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 860px;
  }

  .banner {
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    border: 2px solid transparent;
  }

  .banner:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }

  .banner:active { transform: translateY(0); }

  .banner-chess {
    background: #1a1a1a;
    border-color: #333;
  }

  .banner-chess img {
    height: 100px;
    object-fit: contain;
    position: absolute;
    right: 10px;
    bottom: 0;
    opacity: 0.9;
  }

  .banner-chess .banner-label {
    font-family: 'Patrick Hand', cursive;
    font-size: 26px;
    color: #fff;
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    line-height: 1.2;
    z-index: 2;
  }

  .banner-placeholder {
    background: #f3f3f3;
    border: 2px dashed #ccc;
  }
  .banner-placeholder .banner-label {
    font-family: 'Patrick Hand', cursive;
    font-size: 15px;
    color: #bbb;
  }
</style>

<div class="page">
  <div class="paper-lines"></div>
  <div class="content">
    <img class="logo" src="https://AhmadsBewerbungen.github.io/4cf0ed4e-aaa9-4b10-b441-4674081c840e-removebg-preview.png" alt="Ahmad's Keller" />

    <div class="banners-grid">

      <a class="banner banner-chess" href="https://example.com" target="_blank">
        <span class="banner-label">Chess</span>
        <img src="https://AhmadsBewerbungen.github.io/chess.png" alt="Chess pieces" />
      </a>

      <div class="banner banner-placeholder">
        <span class="banner-label">coming soon...</span>
      </div>

      <div class="banner banner-placeholder">
        <span class="banner-label">coming soon...</span>
      </div>

    </div>
  </div>
</div>
