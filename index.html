<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pet Ayman</title>

  <link rel="stylesheet" href="style3.css?v=3" />
</head>
<body>

<!-- Optional photo wallpaper (hidden if file missing) -->
<img id="bg-img" class="is-hidden" src="assets/windows_background.jpg" alt="" decoding="async" />

<!-- DESKTOP -->
<div id="desktop">

  <!-- ICONS -->
  <div id="icons">

    <div class="icon big" data-app="explorer">
      <div class="icon-graphic" aria-hidden="true">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path fill="#f4d03f" d="M8 18h20l4 6h24v32H8z"/>
          <path fill="#d4ac0d" d="M8 18v38h48V24H32l-4-6z" opacity=".35"/>
          <path fill="#f7dc6f" d="M10 22h17l3 4H54v28H10z"/>
        </svg>
      </div>
      <span>Files</span>
    </div>

    <div class="icon" data-app="settings">
      <div class="icon-graphic" aria-hidden="true">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="10" fill="#bdc3c7"/>
          <path fill="#7f8c8d" d="M32 8l4 7h8l-4 7 4 7h-8l-4 7-4-7h-8l4-7-4-7h8z"/>
          <path fill="#95a5a6" d="M32 14l2.5 4.5h5l-2.5 4.5 2.5 4.5h-5L32 32l-2.5-4.5h-5l2.5-4.5-2.5-4.5h5z"/>
        </svg>
      </div>
      <span>Settings</span>
    </div>

  </div>

  <div id="windows"></div>

  <div id="taskbar">
    <button type="button" id="start-btn">Start</button>
    <div id="clock" aria-live="polite"></div>
  </div>

  <div id="start-menu" class="hidden">
    <div data-app="explorer">File Explorer</div>
    <div data-app="settings">Settings</div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
