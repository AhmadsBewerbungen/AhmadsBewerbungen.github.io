<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Popup bewegt sich</title>
</head>
<body>

<button id="start">Popup starten</button>

<script>
document.getElementById("start").addEventListener("click", () => {

    const popup = window.open(
        "",
        "",
        "width=200,height=150"
    );

    if (!popup) {
        alert("Popup wurde blockiert.");
        return;
    }

    popup.document.write("<h2>Hallo!</h2>");

    let x = 100;
    let y = 100;
    let dx = 5;
    let dy = 4;

    setInterval(() => {
        x += dx;
        y += dy;

        if (x < 0 || x > screen.availWidth - 200) dx *= -1;
        if (y < 0 || y > screen.availHeight - 150) dy *= -1;

        try {
            popup.moveTo(x, y);
        } catch (e) {}
    }, 20);

});
</script>

</body>
</html>
